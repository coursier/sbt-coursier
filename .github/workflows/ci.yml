name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  coursier-snapshot:
    name: coursier snapshot
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8.1
    - name: Build and publish coursier locally
      run: scripts/publish-local-coursier.sh
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: m2-repo
        path: m2-repo
        if-no-files-found: error

  formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: false
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 8
        apps: sbt
    - run: sbt scalafmtCheckAll

  test:
    needs: coursier-snapshot
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Don't convert LF to CRLF during checkout
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8.1
    - uses: coursier/setup-action@v3.0
      with:
        jvm: 8
        apps: sbt
    # m2-repo is the maven repository the build resolves the coursier modules
    # from (see build.sbt)
    - name: Get the coursier snapshot
      uses: actions/download-artifact@v8
      with:
        name: m2-repo
        path: m2-repo
    - run: scripts/ci.sh
      shell: bash

  publish:
    needs: [coursier-snapshot, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8.1
      - uses: coursier/setup-action@v3.0
        with:
          jvm: 8
          apps: sbt
      - uses: olafurpg/setup-gpg@v3
      - name: Get the coursier snapshot
        uses: actions/download-artifact@v8
        with:
          name: m2-repo
          path: m2-repo
      - name: Release
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
