name: CI
on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:

jobs:
  coursier-snapshot:
    name: coursier snapshot
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    # The coursier snapshot only changes when publish-local-coursier.sh changes
    # (most often to bump the coursier tag it builds), so we cache m2-repo,
    # keyed on that script, rather than rebuild coursier on every run.
    #
    # Note that only caches written by runs on the default branch are visible to
    # all the other branches - a pull request that bumps the coursier tag
    # rebuilds coursier on each of its runs, until it's merged.
    - name: Cache the coursier snapshot
      id: cache
      uses: actions/cache@v6
      with:
        path: m2-repo
        key: m2-repo-${{ runner.os }}-${{ hashFiles('scripts/publish-local-coursier.sh') }}
    - uses: coursier/cache-action@v8
      if: steps.cache.outputs.cache-hit != 'true'
    - name: Build and publish coursier locally
      if: steps.cache.outputs.cache-hit != 'true'
      run: scripts/publish-local-coursier.sh
      shell: bash
    - uses: actions/upload-artifact@v7
      with:
        name: m2-repo
        path: m2-repo
        if-no-files-found: error

  jni-utils-version:
    needs: coursier-snapshot
    name: jni-utils version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
    - name: Get the coursier snapshot
      uses: actions/download-artifact@v8
      with:
        name: m2-repo
        path: m2-repo
    - run: scripts/check-jni-utils-version.sh
      shell: bash

  formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: false
    - uses: coursier/setup-action@v3
      with:
        jvm: 8
        apps: sbt
    - run: sbt scalafmtCheckAll

  test:
    needs: coursier-snapshot
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Don't convert LF to CRLF during checkout
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: true
    - uses: coursier/cache-action@v8
    - uses: coursier/setup-action@v3
      with:
        jvm: 8
        apps: sbt
    # m2-repo is the maven repository the build resolves the coursier modules
    # from (see build.sbt)
    - name: Get the coursier snapshot
      uses: actions/download-artifact@v8
      with:
        name: m2-repo
        path: m2-repo
    - run: scripts/ci.sh
      shell: bash

  publish:
    needs: [coursier-snapshot, jni-utils-version, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: coursier/cache-action@v8
      - uses: coursier/setup-action@v3
        with:
          jvm: 8
          apps: sbt
      - name: Get the coursier snapshot
        uses: actions/download-artifact@v8
        with:
          name: m2-repo
          path: m2-repo
      - name: Release
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            # A tag can point at HEAD here, when it is pushed right after the commit it tags.
            # Get it out of the way, so that a snapshot version is computed and published,
            # rather than the release version (which the tag build publishes).
            for tag in $(git tag --points-at HEAD); do
              git tag -d "$tag"
            done
          fi
          sbt ci-release
        env:
          # sonaUpload rather than the sonaRelease sbt-ci-release runs by default: the bundle is
          # uploaded to and validated by Sonatype Central, but has to be published manually from
          # https://central.sonatype.com/publishing/deployments
          CI_SONATYPE_RELEASE: sonaUpload
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
