# This repository targets sbt 1.x only, don't get PRs bumping sbt to 2.x
# scala-xml is pinned to 2.x too: its version ends up verbatim in the
# lm-coursier-shaded POM, so a 3.x bump would push an incompatible version
# onto sbt 1.x, which resolves scala-xml 2.x (eviction error at best).
updates.pin  = [
  { groupId = "org.slf4j", artifactId="slf4j-api", version = "1." },
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." },
  { groupId = "org.scala-sbt", artifactId = "scripted-plugin", version = "1." },
  # librarymanagement-ivy is deliberately kept at the oldest version we support:
  # it is a compile dependency of lm-coursier-shaded, so its version is the
  # minimum librarymanagement that consumers (sbt 1.x itself) need. The sbt API
  # lm-coursier uses is unchanged in later 1.x releases, so bumping it would only
  # raise that floor, and pull in newer io / util-logging / collections along the way.
  { groupId = "org.scala-sbt", artifactId = "librarymanagement-ivy", version = "1.3." },
  { groupId = "org.scala-lang.modules", artifactId = "scala-xml", version = "2." }
]
